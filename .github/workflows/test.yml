name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.25.4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Run tests
        run: task unit_test

      - name: Run Build
        run: task build

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  clean:
    desc: Clean build outputs and dependencies
    cmds:
      - rm -rf packages/*/dist apps/*/dist dist node_modules packages/*/node_modules apps/*/node_modules

  install:
    desc: Install dependencies using bun
    run: once
    sources:
      - package.json
      - 'packages/*/package.json'
      - 'apps/*/package.json'
      - bun.lock
    cmds:
      - bun install

  typecheck:
    desc: Run TypeScript typechecking across all monorepo packages
    cmds:
      - bun run typecheck
    deps:
      - install

  lint:
    desc: Run Biome linter across the monorepo
    cmds:
      - bun run lint
    deps:
      - install

  lint:fix:
    desc: Run Biome linter and automatically fix issues
    cmds:
      - bun run lint:fix
    deps:
      - install

  test:
    desc: Run tests across the monorepo using bun test
    cmds:
      - bun test
    deps:
      - install

  unit_test:
    desc: Run unit tests (alias for root Taskfile compatibility)
    cmds:
      - task: test

  full_test:
    desc: Integration tests for agentic harness
    cmds:
      - SELF_HOSTED_MODEL_BASE_URL=http://localhost:8080/v1 bun test
    deps:
      - install

  build:
    desc: Build all packages and apps in the monorepo
    cmds:
      - bun run build
    deps:
      - install

  compile:target:
    desc: "Compile single binary target (Usage: task compile:target OS=linux ARCH=x64)"
    cmds:
      - bun build --compile --minify --sourcemap --bytecode --target=bun-{{.OS}}-{{.ARCH}} ./apps/agentic-harness/src/index.ts --outfile ./dist/agentic-harness-{{.OS}}-{{.ARCH}}{{.EXT}}

  compile:
    desc: Native compile standalone binaries for Linux, Windows, and macOS (x64 & arm64) using Bun
    cmds:
      - mkdir -p dist
      - task: compile:target
        vars: { OS: linux, ARCH: x64 }
      - task: compile:target
        vars: { OS: linux, ARCH: arm64 }
      - task: compile:target
        vars: { OS: windows, ARCH: x64, EXT: .exe }
      - task: compile:target
        vars: { OS: windows, ARCH: arm64, EXT: .exe }
      - task: compile:target
        vars: { OS: darwin, ARCH: x64 }
      - task: compile:target
        vars: { OS: darwin, ARCH: arm64 }
    deps:
      - install

  check:
    desc: Run linting, typechecking, and tests
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  run:
    desc: Run the agentic harness application
    cmds:
      - bun run --filter @byo-ai-agent-platform/agentic-harness start
    deps:
      - build

  build_container_image:
    desc: Build a specific container target image
    deps:
      - compile
    cmds:
      - docker build -f docker/Dockerfile --target {{.TARGET}} -t agentic-harness:{{.TARGET}} .

  build_container_images:
    desc: Build container images for agentic harness targets (distroless, debian, redhat, ubi10-minimal)
    deps:
      - task: build_container_image
        vars: { TARGET: 'distroless' }
      - task: build_container_image
        vars: { TARGET: 'debian' }
      - task: build_container_image
        vars: { TARGET: 'redhat' }
      - task: build_container_image
        vars: { TARGET: 'ubi10-minimal' }

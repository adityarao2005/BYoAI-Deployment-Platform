# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install dependencies using bun
    run: once
    sources:
      - package.json
      - 'packages/*/package.json'
      - 'apps/*/package.json'
      - bun.lock
    cmds:
      - bun install

  typecheck:
    desc: Run TypeScript typechecking across all monorepo packages
    cmds:
      - bun run typecheck
    deps:
      - install

  lint:
    desc: Run Biome linter across the monorepo
    cmds:
      - bun run lint
    deps:
      - install

  lint:fix:
    desc: Run Biome linter and automatically fix issues
    cmds:
      - bun run lint:fix
    deps:
      - install

  test:
    desc: Run tests across the monorepo using bun test
    cmds:
      - bun test
    deps:
      - install

  unit_test:
    desc: Run unit tests (alias for root Taskfile compatibility)
    cmds:
      - task: test

  build:
    desc: Build all packages and apps in the monorepo
    cmds:
      - bun run build
    deps:
      - install

  check:
    desc: Run linting, typechecking, and tests
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  build_container_image:
    desc: Build a specific container target image
    cmds:
      - docker build -f apps/agentic-harness/docker/Dockerfile --target {{.TARGET}} -t agentic-harness:{{.TARGET}} .

  build_container_images:
    desc: Build container images for agentic harness targets (distroless, debian, redhat, ubi10-minimal)
    deps:
      - task: build_container_image
        vars: { TARGET: 'distroless' }
      - task: build_container_image
        vars: { TARGET: 'debian' }
      - task: build_container_image
        vars: { TARGET: 'redhat' }
      - task: build_container_image
        vars: { TARGET: 'ubi10-minimal' }


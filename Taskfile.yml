# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  VERSION:
    sh: cat VERSION | tr -d '[:space:]'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

includes:
  agentic_harness:
    taskfile: 'Taskfile.bun.yml'
  computer_controller:
    taskfile: apps/computer_controller/Taskfile.yml
    dir: apps/computer_controller
  chat_ui:
    taskfile: apps/chat-ui/Taskfile.yml
    dir: apps/chat-ui
  shell_cli:
    taskfile: apps/shell-cli/Taskfile.yml
    dir: apps/shell-cli

tasks:
  version:
    desc: Display the current platform version
    cmds:
      - echo "{{.VERSION}} (commit {{.GIT_COMMIT}}, built {{.BUILD_DATE}})"

  unit_test:
    desc: Test all packages and apps across the monorepo
    deps:
      - agentic_harness:unit_test
      - computer_controller:test
      - chat_ui:test
      - shell_cli:test

  integration_test:
    desc: Run containerized integration tests using testcontainers (requires Docker)
    deps:
      - agentic_harness:integration_test

  benchmark:
    desc: Run the compliance and performance benchmark suite
    deps:
      - agentic_harness:benchmark

  build:
    desc: Builds all packages and apps across the monorepo
    deps:
      - unit_test
      - computer_controller:build
      - agentic_harness:build
      - chat_ui:build
      - shell_cli:build

  generate_proto:
    desc: Generate protobuf stubs
    run: once
    sources:
      - 'computer_api/**/*.proto'
      - buf.yaml
      - buf.gen.yaml
      - buf.lock
    generates:
      - 'apps/computer_controller/gen/**/*'
      - 'packages/core/src/gen/**/*'
    cmds:
      - buf dep update
      - buf lint
      - buf generate

  cross_build:
    desc: Cross-compile all Go binaries for a specific OS/architecture
    requires:
      vars: [GOOS, GOARCH]
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "dist"}}'
    cmds:
      - task: computer_controller:cross_build
        vars: { GOOS: '{{.GOOS}}', GOARCH: '{{.GOARCH}}', OUTPUT_DIR: '../../{{.OUTPUT_DIR}}' }
      - task: chat_ui:cross_build
        vars: { GOOS: '{{.GOOS}}', GOARCH: '{{.GOARCH}}', OUTPUT_DIR: '../../{{.OUTPUT_DIR}}' }
      - task: shell_cli:cross_build
        vars: { GOOS: '{{.GOOS}}', GOARCH: '{{.GOARCH}}', OUTPUT_DIR: '../../{{.OUTPUT_DIR}}' }

  build_container_images:
    desc: Builds the container images
    deps:
      - build
      - computer_controller:build_container_images
      - agentic_harness:build_container_images
      - chat_ui:build_container_images
      - shell_cli:build_container_images

  release:
    desc: Tag a release from the current VERSION file and push the tag
    preconditions:
      - sh: '[ -f VERSION ]'
        msg: 'VERSION file not found'
      - sh: 'git diff --quiet HEAD'
        msg: 'Working directory is dirty — commit all changes first'
    cmds:
      - |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        TAG="v${VERSION}"
        echo "🏷️  Tagging release ${TAG}..."
        git tag -a "${TAG}" -m "Release ${TAG}"
        git push origin "${TAG}"
        echo "✅ Tag ${TAG} pushed. Release workflow will run on GitHub Actions."
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  VERSION:
    sh: cat ../../VERSION | tr -d '[:space:]'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.gitCommit={{.GIT_COMMIT}}
    -X main.buildDate={{.BUILD_DATE}}

tasks:
  install_frontend:
    desc: Install Chat UI frontend dependencies
    dir: frontend
    run: once
    sources:
      - 'package.json'
      - 'bun.lock'
    cmds:
      - bun install

  build_frontend:
    desc: Build Chat UI React frontend
    deps:
      - install_frontend
    dir: frontend
    run: once
    sources:
      - 'src/**/*'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
    generates:
      - 'dist/**/*'
    cmds:
      - bun run build

  build:
    desc: Build the Chat UI binary
    deps:
      - build_frontend
    run: once
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - 'frontend/dist/**/*'
    generates:
      - bin/chat-ui
    cmds:
      - go fmt ./...
      - go mod tidy
      - CGO_ENABLED=0 go build -v -trimpath -ldflags="{{.LDFLAGS}}" -o bin/chat-ui ./cmd/server

  cross_build:
    desc: Cross-compile Chat UI for a specific OS/architecture
    deps:
      - build_frontend
    requires:
      vars: [GOOS, GOARCH]
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "bin"}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
    cmds:
      - CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -v -trimpath -ldflags="{{.LDFLAGS}}" -o {{.OUTPUT_DIR}}/chat-ui-{{.GOOS}}-{{.GOARCH}}{{.EXT}} ./cmd/server

  test:
    desc: Run unit tests for Chat UI
    deps:
      - build_frontend
    run: once
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - 'frontend/dist/**/*'
    cmds:
      - go test -v ./...

  run:
    desc: Run the Chat UI server locally
    cmds:
      - go run ./cmd/server

  build_container_image:
    desc: Build Chat UI container image
    deps:
      - build
      - test
    cmds:
      - docker build -f docker/Dockerfile --label "org.opencontainers.image.version={{.VERSION}}" -t chat-ui:{{.VERSION}} -t chat-ui:latest .

  build_container_images:
    desc: Build all container images for Chat UI
    deps:
      - task: build_container_image


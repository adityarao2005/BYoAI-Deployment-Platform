# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  VERSION:
    sh: cat ../../VERSION | tr -d '[:space:]'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.gitCommit={{.GIT_COMMIT}}
    -X main.buildDate={{.BUILD_DATE}}

tasks:
  build:
    desc: Build the computer controller binary
    run: once
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - ../../VERSION
    generates:
      - bin/controller
    cmds:
      - go fmt ./...
      - go mod tidy
      - CGO_ENABLED=0 go build -v -trimpath -ldflags="{{.LDFLAGS}}" -o bin/controller ./cmd/controller

  cross_build:
    desc: Cross-compile computer controller for a specific OS/architecture
    requires:
      vars: [GOOS, GOARCH]
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "bin"}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
    cmds:
      - CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -v -trimpath -ldflags="{{.LDFLAGS}}" -o {{.OUTPUT_DIR}}/controller-{{.GOOS}}-{{.GOARCH}}{{.EXT}} ./cmd/controller

  test:
    desc: Run unit tests for computer controller
    run: once
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    cmds:
      - go test -v ./...

  docker_test:
    desc: Run unit tests for computer controller including that which talks to docker
    cmds:
      - DOCKER_INTEGRATION_TEST=1 go test -v ./...

  run:
    desc: Run the computer controller locally
    cmds:
      - go run ./cmd/controller

  build_container_image:
    desc: Build a specific container target image
    deps:
      - build
      - test
    cmds:
      - docker build -f docker/Dockerfile --target {{.TARGET | default "scratch"}} --label "org.opencontainers.image.version={{.VERSION}}" -t computer-controller:{{.TARGET | default "latest"}}-{{.VERSION}} -t computer-controller:{{.TARGET | default "latest"}} .

  build_container_images:
    desc: Build container images for computer controller (scratch, distroless, podman)
    deps:
      - task: build_container_image
        vars: { TARGET: 'scratch' }
      - task: build_container_image
        vars: { TARGET: 'distroless' }
      - task: build_container_image
        vars: { TARGET: 'podman' }
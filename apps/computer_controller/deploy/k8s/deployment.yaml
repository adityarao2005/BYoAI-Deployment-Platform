apiVersion: apps/v1
kind: Deployment
metadata:
  name: computer-controller
  namespace: byoai-sandboxes
  labels:
    app.kubernetes.io/name: computer-controller
    app.kubernetes.io/part-of: byoai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: computer-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: computer-controller
        app.kubernetes.io/part-of: byoai-platform
    spec:
      serviceAccountName: computer-controller
      containers:
        - name: controller
          image: computer-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: computer-controller-secrets
                  key: api-key
                  optional: true
          ports:
            - name: connect-rpc
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /app/computer.yaml
              subPath: computer.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: computer-controller-config

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  VERSION:
    sh: cat ../../VERSION | tr -d '[:space:]'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.gitCommit={{.GIT_COMMIT}}
    -X main.buildDate={{.BUILD_DATE}}

tasks:
  build:
    desc: Build the Shell CLI binary
    run: once
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - bin/byoai
    cmds:
      - go fmt ./...
      - go mod tidy
      - CGO_ENABLED=0 go build -v -trimpath -ldflags="{{.LDFLAGS}}" -o bin/byoai ./cmd/byoai

  cross_build:
    desc: Cross-compile Shell CLI for a specific OS/architecture
    requires:
      vars: [GOOS, GOARCH]
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "bin"}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
    cmds:
      - CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -v -trimpath -ldflags="{{.LDFLAGS}}" -o {{.OUTPUT_DIR}}/byoai-{{.GOOS}}-{{.GOARCH}}{{.EXT}} ./cmd/byoai

  test:
    desc: Run unit tests for Shell CLI
    run: once
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    cmds:
      - go test -v ./...

  run:
    desc: Run the Shell CLI locally
    cmds:
      - go run ./cmd/byoai

  build_container_image:
    desc: Build Shell CLI container image
    deps:
      - build
      - test
    cmds:
      - docker build -f docker/Dockerfile --label "org.opencontainers.image.version={{.VERSION}}" -t shell-cli:{{.VERSION}} -t shell-cli:latest .

  build_container_images:
    desc: Build all container images for Shell CLI
    deps:
      - task: build_container_image


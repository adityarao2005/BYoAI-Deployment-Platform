version: v2
plugins:
  - local: protoc-gen-go
    out: computer_controller/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: computer_controller/gen
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es
    out: '@byo-ai-agent-platform/packages/core/src/gen'
    opt: target=ts
    include_imports: true
  - remote: buf.build/connectrpc/es
    out: '@byo-ai-agent-platform/packages/core/src/gen'
    opt: target=ts
    include_imports: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/adityarao2005/BYoAI-Deployment-Platform/computer_controller/gen
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
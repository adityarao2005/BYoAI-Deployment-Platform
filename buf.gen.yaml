version: v2
plugins:
  - local: protoc-gen-go
    out: computer_controller/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: computer_controller/gen
    opt:
      - paths=source_relative
  - local: ./agentic_harness/node_modules/.bin/protoc-gen-es
    out: agentic_harness/src/gen
    opt: target=ts
    include_imports: true
  - local: ./agentic_harness/node_modules/.bin/protoc-gen-connect-es
    out: agentic_harness/src/gen
    opt: target=ts
    include_imports: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/adityarao2005/BYoAI-Deployment-Platform/computer_controller/gen
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
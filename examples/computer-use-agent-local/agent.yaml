name: LocalComputerAgent
description: A general purpose agent with direct access to local host computer execution capabilities.
models:
  - name: gemini-3.7-flash
    brand: gemini
    properties:
      apiKey: "${GEMINI_API_KEY}"

toolProviders:
  - type: computer
    provider:
      type: local
      enableGUIToolsIfAvailable: false

security:
  jwksUri: "${OAUTH_JWKS_URI:-http://oauth-provider:8080/default/jwks}"
  alg:
    - RS256
  verify:
    iss: "${OAUTH_ISSUER_URI:-http://localhost:8090/default}"

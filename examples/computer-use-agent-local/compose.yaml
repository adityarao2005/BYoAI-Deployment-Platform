# Docker Compose orchestration for Local Computer Use Agent Full Stack deployment
# Includes:
#   - Mock OAuth2/OIDC Provider (ghcr.io/navikt/mock-oauth2-server) on port 8090
#   - Agentic Harness runtime (agentic-harness:latest) on port 3000
#   - Chat UI web frontend (chat-ui:latest) on port 8081

services:
  # ---------------------------------------------------------------------------
  # Lightweight Self-Hosted OIDC / OAuth2 Identity Provider
  # ---------------------------------------------------------------------------
  oauth-provider:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: byoai-local-cu-oauth-provider
    ports:
      - "8090:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_HOSTNAME: 0.0.0.0

  # ---------------------------------------------------------------------------
  # Agentic Harness (Core Runtime with Local Computer Provider)
  # ---------------------------------------------------------------------------
  agentic-harness:
    image: agentic-harness:latest
    container_name: byoai-local-cu-agentic-harness
    ports:
      - "3000:3000"
    environment:
      AGENT_CONFIG_PATH: /workspace/agent.yaml
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 3000
    volumes:
      - ./agent.yaml:/workspace/agent.yaml:ro
    depends_on:
      - oauth-provider

  # ---------------------------------------------------------------------------
  # Chat UI (React 19 SPA + Go OAuth Backend)
  # ---------------------------------------------------------------------------
  chat-ui:
    image: chat-ui:latest
    container_name: byoai-local-cu-chat-ui
    ports:
      - "8081:8081"
    environment:
      AGENT_HARNESS_URI: http://agentic-harness:3000
      OAUTH_ISSUER_URI: http://localhost:8090/default
      OAUTH_CLIENT_ID: byoai-chat-ui
      OAUTH_CLIENT_SECRET: dev-secret-change-in-prod
      OAUTH_CALLBACK_PATH: /auth/callback
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-key-at-least-32-bytes!}
      LISTEN_ADDR: ":8081"
      LOG_LEVEL: debug
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - agentic-harness
      - oauth-provider

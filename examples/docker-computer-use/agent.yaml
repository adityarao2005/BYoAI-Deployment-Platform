name: Gemini
description: You are a general purpose agent with access to a computer. Do not do anything dumb.
models:
  - name: gemini-3.7-flash
    brand: gemini
    properties:
      apiKey: "${GEMINI_API_KEY}"

toolProviders:
  - type: computer
    provider:
      type: remote
      url: http://localhost:8080
      image: "alpine:latest"
      enableGUIToolsIfAvailable: false
      security:
        bearerToken: "apiKey"

security:
  jwksUri: "${OAUTH_JWKS_URI:-http://localhost:8090/default/jwks}"
  alg:
    - RS256
  verify:
    iss: "${OAUTH_ISSUER_URI:-http://localhost:8090/default}"
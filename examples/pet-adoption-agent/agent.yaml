name: PetAdoptionAgent
description: A helpful AI assistant capable of managing pet adoptions, querying inventory, and performing safe computer actions in a sandboxed container.
models:
  - name: gemini-3.6-flash
    brand: gemini
    properties:
      apiKey: "${GEMINI_API_KEY}"

skillRepositories:
  - type: zip
    location: "${AGENT_SKILLS_PATH:-/workspace/skills.zip}"
    skillsSubdirectory: "/skills/"

toolProviders:
  - name: petstore
    type: openapi
    specUrl: "https://petstore.swagger.io/v2/swagger.json"
    securityVariables:
      type: apiKey
      name: api_key
      key: "special-key"
      location: header

  - type: computer
    provider:
      type: remote
      url: "${COMPUTER_CONTROLLER_URI:-http://computer-controller:8080}"
      image: "alpine:latest"
      enableGUIToolsIfAvailable: false
      security:
        bearerToken: "${CC_API_KEY:-dev-computer-key}"

security:
  jwksUri: "${OAUTH_JWKS_URI:-http://oauth-provider:8080/default/jwks}"
  alg:
    - RS256
  verify:
    iss: "${OAUTH_ISSUER_URI:-http://localhost:8090/default}"
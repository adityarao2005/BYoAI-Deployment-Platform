name: Petty
description: You are a pet adoption agent helping people adopt pets.
models:
  - name: gemini-3.7-flash
    brand: gemini
    properties:
      apiKey: "${GEMINI_API_KEY}"

skillRepositories:
  - type: zip
    location: "${AGENT_SKILLS_PATH:-skills.zip}"
    skillsSubdirectory: "/skills/"

toolProviders:
  - name: petstore
    type: openapi
    specUrl: "https://petstore.swagger.io/v2/swagger.json"
    securityVariables:
      type: apiKey
      name: api_key
      key: "special-key"
      location: header

security:
  jwksUri: "${OAUTH_JWKS_URI:-http://localhost:8090/default/jwks}"
  alg:
    - RS256
  verify:
    iss: "${OAUTH_ISSUER_URI:-http://localhost:8090/default}"